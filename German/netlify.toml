[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

# HTML は常に再検証（SPA更新をすぐ反映）
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"

# 静的アセット（JS/CSS/画像）は長めにキャッシュ
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# データJSONは短め
[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Access-Control-Allow-Origin = "*"
